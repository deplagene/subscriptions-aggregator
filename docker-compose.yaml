services:
  postgres:
    image: postgres:17-alpine
    container_name: subaggregator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subaggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d subaggregator']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
