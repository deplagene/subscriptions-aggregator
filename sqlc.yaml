version: '2'

sql:
  - engine: 'postgresql'
    schema:
      - 'internal/postgres/schema.sql'
    queries:
      - 'internal/postgres/query'
    gen:
      go:
        package: 'sqlc'
        out: 'internal/postgres/sqlc'
        sql_package: 'pgx/v5'
        emit_interface: true
        emit_empty_slices: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: 'uuid'
            go_type:
              import: 'github.com/google/uuid'
              type: 'UUID'
