version: '3'

vars:
  GO_VERSION: '1.26.1'
  GOLANGCI_LINT_VERSION: 'v2.10.1'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'
  SQLC_VERSION: 'v1.30.0'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  SQLC: '{{.BIN_DIR}}/sqlc'

tasks:
  install-formatters:
    desc: 'Устанавливает форматтеры gci и gofumpt в ./bin'
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: 'Форматирует весь проект gofumpt + gci'
    deps: [install-formatters]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🎯 Сортируем импорты через gci ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default {} +

  install-golangci-lint:
    desc: 'Устанавливает golangci-lint в каталог bin'
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: 'Запускает golangci-lint для всех модулей'
    deps: [install-golangci-lint]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yaml'

  install-sqlc:
    desc: 'Устанавливает sqlc в каталог bin'
    cmds:
      - |
        [ -f {{.SQLC}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем sqlc {{.SQLC_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
        }
    status:
      - test -x {{.SQLC}}

  sqlc-generate:
    desc: 'Генерирует Go-код из SQL-запросов через sqlc'
    deps: [install-sqlc]
    cmds:
      - '{{.SQLC}} generate'

  sqlc-vet:
    desc: 'Проверяет SQL-запросы и конфиг sqlc'
    deps: [install-sqlc]
    cmds:
      - echo "🔍 Проверяем sqlc..."
      - '{{.SQLC}} vet'
      - echo "✅ sqlc vet passed"

  test:
    desc: 'Запускает go test для всего проекта'
    cmds:
      - |
        mkdir -p .cache/go-build
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go test ./...

  test-coverage:
    desc: 'Запускает go test с покрытием и сохраняет профиль'
    cmds:
      - |
        mkdir -p .cache/go-build .cache/coverage
        GOCACHE={{.ROOT_DIR}}/.cache/go-build go test ./... -coverprofile=.cache/coverage/coverage.out
